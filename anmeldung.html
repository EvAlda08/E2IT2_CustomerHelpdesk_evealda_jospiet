<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Anmeldung</title>
    <link rel="stylesheet" href="anmeldung.css">
</head>

<body>

<div class="login-container">

    <h1>👤 Kundenanmeldung</h1>

    <form>

        <label>E-Mail</label>
        <input type="email" placeholder="E-Mail eingeben">

        <label>Passwort</label>
        <input type="password" placeholder="Passwort eingeben">

        <button type="submit">
            Anmelden
        </button>

    </form>

    <p>
        Noch kein Konto?
        <a href="#">Jetzt registrieren</a>
    </p>

</div>

</body>
</html>
